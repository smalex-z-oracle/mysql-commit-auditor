name: Bug verification OCI smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feat/code-submission-check

permissions:
  contents: read

jobs:
  smoke-test:
    name: Call OCI Generative AI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/bug-verification/requirements.txt

      - name: Install OpenAI SDK
        run: python -m pip install --requirement .github/bug-verification/requirements.txt

      - name: Run OCI smoke test
        env:
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
        run: python .github/scripts/bug_verification_triage.py --smoke-test
