name: Bug verification

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: bug-verification-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Draft issue triage
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'verification:run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: bug-verification-oci
    permissions:
      contents: read
      issues: write

    outputs:
      assessment_digest: ${{ steps.triage.outputs.assessment_digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/bug-verification/requirements.txt

      - name: Install OpenAI SDK
        run: python -m pip install --requirement .github/bug-verification/requirements.txt

      - name: Triage issue
        id: triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_GENAI_BASE_URL: ${{ vars.OCI_GENAI_BASE_URL }}
          OCI_GENAI_PROJECT: ${{ vars.OCI_GENAI_PROJECT }}
          OCI_GENAI_MODEL: ${{ vars.OCI_GENAI_MODEL }}
        run: python .github/scripts/bug_verification_triage.py --github-event "$GITHUB_EVENT_PATH"

  execute:
    name: Run approved reproduction
    needs: triage
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'verification:run' &&
      needs.triage.outputs.assessment_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate reproduction runner
        run: python .github/scripts/bug_verification_runner.py --self-test

      - name: Run approved reproduction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ASSESSMENT_DIGEST: ${{ needs.triage.outputs.assessment_digest }}
        run: python .github/scripts/bug_verification_runner.py --github-event "$GITHUB_EVENT_PATH"
